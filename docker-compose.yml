version: '3.8'

services:
  # Existing Python Backend (REST API, SQLite, Gemini AI integration, Game Logic)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BACKEND_PORT=5000
    volumes:
      - ./data:/app/data

  # Flutter / Web Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
